<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script type="text/javascript">
      // Adjust base path to match vite.config.ts `base` value
      var base = "/ecoexplorer/";

      // Save the current path so the SPA router can restore it
      var redirectTo = window.location.pathname + window.location.search + window.location.hash;
      sessionStorage.redirect = redirectTo;

      // Redirect to the base index.html
      window.location.href = base;
    </script>
  </head>
  <body></body>
</html>
